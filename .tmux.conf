set -g mouse on
# Remap "r" to reload tmux config
unbind r
bind r source-file ~/.tmux.conf
# Bind leader key to "<CTRL> + s"
unbind C-b
set -g prefix C-s
bind C-s send-prefix
# Set history limit
set -g history-limit 1000000
# Allow complex terminal colours
set -s default-terminal 'tmux-256color'
set -as terminal-overrides ",*:Tc"
# Enable clipboard operation
set-option -g set-clipboard on
# Split panes with "q" (horizontal) and "e" (vertival)
unbind '"'
unbind %
bind q split-window -h -c "#{pane_current_path}"
bind e split-window -v -c "#{pane_current_path}"
# Start Windows & Panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Top directory bar
set -g pane-border-status top
set -g pane-border-format "#[bg=#6272a4,fg=black]  #{pane_current_path} #[default]"

# Keep tmux status bar at the bottom
set -g status-position bottom

# Beginning and end of line
bind-key -n C-a send-keys Home
bind-key -n C-e send-keys End

# Session manager popup: prefix + Ctrl-P
bind C-p display-popup -E -w 60% -h 50% "~/.tmux/session-manager.sh"

# New pentest session popup: prefix + Ctrl-T
bind C-t display-popup -E -w 60% -h 60% "bash -c 'read -p \"Client name: \" c; read -p \"Scope (IP/domain  |  f=pick file  |  blank=paste): \" s; if [ \"\$s\" = \"f\" ]; then s=\$(find \$HOME -type f \\( -name \"*.txt\" -o -name \"*.list\" -o -name \"*.csv\" \\) 2>/dev/null | fzf --prompt=\"  Scope file: \" --border=rounded --preview=\"head -30 {}\" --preview-window=right:50%); fi; read -p \"Logins/notes (blank to skip): \" n; ~/.tmux/pentest.sh \"\$c\" \"\$s\" \"\$n\"'"

# Dracula status bar
set -g status-style bg=#282a36,fg=#f8f8f2
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[bg=#bd93f9,fg=#282a36,bold] #S #[bg=#282a36,fg=#bd93f9,nobold]'
set -g status-right '#[fg=#44475a]#[bg=#44475a,fg=#6272a4] %Y-%m-%d #[fg=#f8f8f2]%H:%M #[bg=#282a36,fg=#bd93f9]#[bg=#bd93f9,fg=#282a36,bold] #H '
set -g window-status-current-style bg=#44475a,fg=#f8f8f2,bold
set -g window-status-current-format ' #I:#W#F '
set -g window-status-style fg=#6272a4
set -g window-status-format ' #I:#W#F '
set -g pane-active-border-style fg=#bd93f9
set -g message-style bg=#44475a,fg=#8be9fd
set -g message-command-style bg=#44475a,fg=#8be9fd

# Copy mode — vi keys
set-window-option -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# Mouse drag auto-copies to clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
# Some sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# Auto-restore sessions when tmux starts
set -g @continuum-restore 'on'
# Auto-save every 5 minutes
set -g @continuum-save-interval '5'

# Initialize TPM (must be last line)
run '~/.tmux/plugins/tpm/tpm'
